<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeStock Ядро 1.0 — Жива демонстрація</title>
    <meta name="description" content="LifeStock — робочий додаток управління запасами. 10 модулів працюють у браузері офлайн.">
    <link rel="icon" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="header" id="top">
    <div class="container header-inner">
        <a href="#top" class="logo">
            <span class="logo-mark">📦</span> Life<span class="logo-accent">Stock</span>
            <span class="logo-version">1.0</span>
        </a>
        <nav class="nav" id="nav">
            <a href="#top" class="nav-link active">Запаси</a>
            <a href="#contact" class="nav-link">Контакти</a>
        </nav>
        <button class="nav-toggle" id="navToggle" aria-label="Меню">
            <span></span><span></span><span></span>
        </button>
    </div>
</header>

<!-- ===== APP ===== -->
<section class="ls-app-section" id="demo">
    <div class="container">
        <div id="lifestock-app"></div>
    </div>
</section>

<!-- ===== CONTACT ===== -->
<section class="contact-section" id="contact">
    <div class="container">
        <div class="section-head">
            <span class="section-tag">Контакти</span>
            <h2>Зв'язок</h2>
            <p class="section-sub">Питання, пропозиції, співпраця.</p>
        </div>
        <div class="contact-grid">
            <div class="contact-card">
                <span class="contact-icon">🐙</span>
                <h4>GitHub</h4>
                <p>Відкритий код</p>
                <a href="https://github.com/ismi9/lifestock-core" class="contact-link">github.com/ismi9/lifestock-core</a>
            </div>
            <div class="contact-card">
                <span class="contact-icon">💬</span>
                <h4>Telegram</h4>
                <p>Швидкі питання</p>
                <a href="https://t.me/ismi9" class="contact-link">@ismi9</a>
            </div>
        </div>
    </div>
</section>

<!-- ===== FOOTER ===== -->
<footer class="footer">
    <div class="container">
        <div class="footer-inner">
            <div class="footer-brand">
                <span class="logo-mark">📦</span> Life<span class="logo-accent">Stock</span>
                <span class="footer-version">Ядро 1.0</span>
            </div>
            <div class="footer-links">
                <a href="#demo">Демонстрація</a>
                <a href="#contact">Контакти</a>
            </div>
        </div>
        <div class="footer-copy">© 2026 LifeStock · MIT License</div>
    </div>
</footer>

<!-- ===== SCRIPTS ===== -->
<script src="js/lib/quagga.min.js"></script>
<script src="js/lib/tesseract/tesseract.min.js"></script>
<script src="js/core/lifestock.js"></script>
<script src="js/core/product.js"></script>
<script src="js/core/batch.js"></script>
<script src="js/core/inventory.js"></script>
<script src="js/core/storage.js"></script>
<script src="js/core/barcode.js"></script>
<script src="js/core/openfoodfacts.js"></script>
<script src="js/core/camera.js"></script>
<script src="js/core/recipe.js"></script>
<script src="js/core/notification.js"></script>
<script src="js/core/security.js"></script>
<script src="js/core/sync.js"></script>
<script src="js/app.js"></script>
<script>
(function () {
  // Mobile nav toggle
  var navToggle = document.getElementById('navToggle');
  var nav = document.getElementById('nav');
  if (navToggle) {
    navToggle.addEventListener('click', function () {
      nav.classList.toggle('open');
      navToggle.classList.toggle('open');
    });
  }
  document.querySelectorAll('.nav-link').forEach(function (link) {
    link.addEventListener('click', function () {
      nav.classList.remove('open');
      navToggle.classList.remove('open');
    });
  });
  // Header shadow
  var header = document.querySelector('.header');
  window.addEventListener('scroll', function () {
    if (window.scrollY > 10) header.classList.add('scrolled');
    else header.classList.remove('scrolled');
  });
  // Active nav spy
  var sections = document.querySelectorAll('section[id], header[id]');
  var navLinks = document.querySelectorAll('.nav-link');
  function updateActive() {
    var pos = window.scrollY + 80;
    var current = 'top';
    sections.forEach(function (sec) {
      if (pos >= sec.offsetTop) current = sec.id;
    });
    navLinks.forEach(function (l) {
      l.classList.remove('active');
      if (l.getAttribute('href') === '#' + current || (current === 'top' && l.getAttribute('href') === '#top')) {
        l.classList.add('active');
      }
    });
  }
  window.addEventListener('scroll', updateActive);
})();
</script>
</body>
</html>
